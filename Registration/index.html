<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <div id="serviceCarousel" class="carousel slide mb-5" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#serviceCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#serviceCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#serviceCarousel" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">
                <div class="bg-primary text-white text-center p-5">
                    <h2>Dịch vụ chuyên nghiệp</h2>
                    <p class="mb-0">Trải nghiệm dịch vụ nhanh chóng và tiện lợi.</p>
                </div>
            </div>

            <div class="carousel-item">
                <div class="bg-success text-white text-center p-5">
                    <h2>An toàn và bảo mật</h2>
                    <p class="mb-0">Thông tin tài khoản của bạn luôn được bảo vệ.</p>
                </div>
            </div>

            <div class="carousel-item">
                <div class="bg-warning text-dark text-center p-5">
                    <h2>Nhiều ưu đãi</h2>
                    <p class="mb-0">Đăng ký ngay để nhận những ưu đãi hấp dẫn.</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button"
                data-bs-target="#serviceCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button"
                data-bs-target="#serviceCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>


    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Đăng ký tài khoản</h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control"
                                   placeholder="Nhập họ và tên">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">@</span>
                                <input type="email" class="form-control"
                                       placeholder="example@email.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control"
                                   placeholder="Nhập mật khẩu">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control"
                                   placeholder="Nhập lại mật khẩu">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Đăng ký
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
